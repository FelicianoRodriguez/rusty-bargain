name: Deploy ML API to AWS ECS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
  ECS_SERVICE: ${{ vars.AWS_ECS_SERVICE }}
  ECS_TASK_DEFINITION: task-definition.json
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}

jobs:
  deploy: 
    name: Build and deploy API
    runs-on: ubuntu-latest
    
    steps:
    # 1. Descarga el código del repositorio
    - name: Checkout repository
      uses: actions/checkout@v4
  
    # 2. Configure AWS credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    # 3. Iniciar sesión en Amazon ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
  
    # 4. Construir y subir la imagen docker
    - name: Build and push Docker image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          .
        docker push \
          $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG 
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> GITHUB_OUTPUT
    
    # 5. Actualizar la imagen en la definición de tarea
    - name: Update ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}
  
    # 6. Desplegar la nueva versión ECS
    - name: Deploy to Amazon ECS
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
      
      
    
      
    
